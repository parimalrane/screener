name: Daily Stock Screener

on:
  schedule:
    # 20:30 UTC = 4:30 PM EDT (Mon-Fri)
    # 21:30 UTC = 4:30 PM EST (Mon-Fri)
    - cron: '30 20 * * 1-5'
  workflow_dispatch: # Allows manual trigger from the GitHub web UI

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Screener
        run: python screener.py

      - name: Upload Results as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screener-results
          path: screener_results.csv
          retention-days: 7
          