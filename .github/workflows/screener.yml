name: Daily Stock Screener

on:
  schedule:
    # 20:30 UTC = 4:30 PM EDT (Mon-Fri)
    # 21:30 UTC = 4:30 PM EST (Mon-Fri)
    - cron: '30 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Screener
        run: python screener.py

      - name: Commit and Push Appended CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          git add screener_results.csv
          git diff --staged --quiet || (git commit -m "Update screener_results.csv [skip ci]" && git push origin main)