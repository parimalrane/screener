name: ASTA Screener - Daily 6PM Run

on:
  schedule:
    # 23:00 UTC = 6:00 PM EST (Monday to Friday)
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Screener
        run: |
          python main.py | tee terminal_output.txt

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: parimalrane@gmail.com
          password: ${{ secrets.GMAIL_PASSWORD }}
          subject: ASTA Master Screener - Daily Results
          body: file://terminal_output.txt
          to: parimalrane@gmail.com
          from: ASTA Screener Bot
          attachments: output/screener_results.csv

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull origin main --rebase
          git stash pop || true
          git add output/screener_results.csv
          git commit -m "Update screener_results.csv [skip ci]" || echo "No changes"
          git push origin main

