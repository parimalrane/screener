name: 4-Hour Oversold/Overbought Tracker

on:
  schedule:
    # 17:30 UTC = 1:30 PM EDT (Mon-Fri) - Mid-Day Check
    - cron: '30 17 * * 1-5'
    # 20:15 UTC = 4:15 PM EDT (Mon-Fri) - Closing Print
    - cron: '15 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-4h-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bullish 4H Scanner
        run: python scanner_4h.py BU | tee terminal_output.txt
        
      - name: Run Bearish 4H Scanner
        run: python scanner_4h.py BE | tee -a terminal_output.txt

      - name: Send Email Notification
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: parimalrane@gmail.com
          password: ${{ secrets.GMAIL_PASSWORD }}
          subject: ASTA 4-Hour Tracker Results
          body: file://terminal_output.txt
          to: parimalrane@gmail.com
          from: ASTA Screener Bot

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull origin main --rebase
          git stash pop || true
          git add output/screener_4h_BU_results.csv output/screener_4h_BE_results.csv
          git commit -m "Update 4H Scanner Results [skip ci]" || echo "No changes"
          git push origin main
